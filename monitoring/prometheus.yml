global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'atsinfra'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:4000']
    metrics_path: '/metrics'

  - job_name: 'parser-service'
    static_configs:
      - targets: ['parser-service:8001']
    metrics_path: '/metrics'

  - job_name: 'pdf-service'
    static_configs:
      - targets: ['pdf-service:8002']
    metrics_path: '/metrics'

  - job_name: 'semantic-service'
    static_configs:
      - targets: ['semantic-service:8003']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
